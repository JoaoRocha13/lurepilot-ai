services:
  postgres:
    image: postgres:16
    container_name: lurepilot-postgres
    restart: always
    environment:
      POSTGRES_DB: lurepilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - lurepilot_postgres_data:/var/lib/postgresql/data

volumes:
  lurepilot_postgres_data: