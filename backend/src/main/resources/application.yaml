server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: lurepilot-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lurepilot}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

lurepilot:
  ai:
    base-url: ${LUREPILOT_AI_BASE_URL:http://localhost:1234/v1}
    model: ${LUREPILOT_AI_MODEL:qwen2.5-7b-instruct}
    connect-timeout-seconds: ${LUREPILOT_AI_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${LUREPILOT_AI_READ_TIMEOUT_SECONDS:60}
    max-tokens: ${LUREPILOT_AI_MAX_TOKENS:600}
  ipma:
    base-url: ${LUREPILOT_IPMA_BASE_URL:https://api.ipma.pt}
    connect-timeout-seconds: ${LUREPILOT_IPMA_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${LUREPILOT_IPMA_READ_TIMEOUT_SECONDS:20}
