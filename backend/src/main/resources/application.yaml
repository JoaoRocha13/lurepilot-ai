server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: lurepilot-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lurepilot}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

lurepilot:
  ai:
    base-url: ${LUREPILOT_AI_BASE_URL:http://localhost:1234/v1}
    model: ${LUREPILOT_AI_MODEL:qwen2.5-7b-instruct}
