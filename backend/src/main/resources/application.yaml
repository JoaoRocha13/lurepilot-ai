server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: lurepilot-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lurepilot}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

lurepilot:
  ai:
    base-url: ${LUREPILOT_AI_BASE_URL:http://localhost:1234/v1}
    model: ${LUREPILOT_AI_MODEL:qwen2.5-7b-instruct}
    connect-timeout-seconds: ${LUREPILOT_AI_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${LUREPILOT_AI_READ_TIMEOUT_SECONDS:60}
    max-tokens: ${LUREPILOT_AI_MAX_TOKENS:600}
  weather:
    forecast-base-url: ${LUREPILOT_WEATHER_FORECAST_BASE_URL:https://api.open-meteo.com}
    geocoding-base-url: ${LUREPILOT_WEATHER_GEOCODING_BASE_URL:https://geocoding-api.open-meteo.com}
    connect-timeout-seconds: ${LUREPILOT_WEATHER_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${LUREPILOT_WEATHER_READ_TIMEOUT_SECONDS:20}
  uploads:
    directory: ${LUREPILOT_UPLOADS_DIRECTORY:uploads}
    public-base-url: ${LUREPILOT_UPLOADS_PUBLIC_BASE_URL:/uploads}
